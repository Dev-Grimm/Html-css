<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>midias em HTML5</title>
</head>
<body>
    <h1>Imagens dinâmicas</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplismente aumente e diminua o tamanho do seu navegador.</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/imgpequena.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/imgmedia.png" type="image/png">
        <img src="imagens/imggrande.png" alt="Imagem flexivel">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5.</p>
   <!-- <audio src="midia/basketcase.mp3" controls autoplay ></audio> - esse não é um bom método para implementar o audio no seu site 
    os formatos compativeis são MP3, WAV, OGG -->

    <audio preload="metadata" autoplay controls loop>
        <source src="midia/basketcase.mp3" type="audio/mpeg">
        <source src="midia/basketcase.ogg" type="audio/ogg">
        <source src="midia/basketcase.wav" type="audio/wav">
        <p>Infelizmente seu navegador não consegue reproduzir audio <a href="midia/basketcase.mp3">clique aqui para baixar o arquivo em MP3</a></p>
    </audio>
</body>
</html>
