<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem Flexivel</title>
</head>
<body>
    <h1>Imagem Flexivel</h1>
    <p>Você está vendo a imagem completa? Experimente ampliar o tamanho da sua janela para aproveitar a melhor experiência.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="desafioimagens/florespequena.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="desafioimagens/floresmedia.png" type="image/png">
        <img src="desafioimagens/floresgrande.png" alt="imagemfloresgrandes" width="100%">
    </picture>
</body>
</html>
